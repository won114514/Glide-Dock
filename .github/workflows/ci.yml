name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: installer/ui/package-lock.json
      - name: Build installer frontend
        working-directory: installer/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Upload installer frontend
        uses: actions/upload-artifact@v7
        with:
          name: installer-ui-dist
          path: target/installer-ui
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: installer/ui/package-lock.json
      - name: Test installer interface
        working-directory: installer/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - name: Test CNB publisher
        run: node --test scripts/tests/publish-cnb.test.mjs scripts/tests/mirror-github-release.test.mjs

  rust-checks:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Exclude workspace and Cargo home from Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:CARGO_HOME -ErrorAction Stop
          } catch {
            Write-Host "::notice::Skipping Defender exclusion: $_"
          }
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-check
      - name: Download installer frontend
        uses: actions/download-artifact@v8
        with:
          name: installer-ui-dist
          path: target/installer-ui
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --profile ci -- -D warnings
      - name: Test
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --locked --workspace --profile ci

  release:
    needs: frontend
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Exclude workspace and Cargo home from Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:CARGO_HOME -ErrorAction Stop
          } catch {
            Write-Host "::notice::Skipping Defender exclusion: $_"
          }
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release
      - name: Download installer frontend
        uses: actions/download-artifact@v8
        with:
          name: installer-ui-dist
          path: target/installer-ui
      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine) { throw 'Cannot read version from Cargo.toml' }
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag $env:GITHUB_REF_NAME does not match workspace version v$version" }
      - name: Build standalone Tauri installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -SkipFrontendBuild -OutputDirectory "$env:GITHUB_WORKSPACE\dist\installer"
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: glide-dock-installer
          path: |
            dist/installer/Glide-Dock-v*-Setup.exe
            dist/installer/Glide-Dock-v*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-github:
    needs: [rust-checks, test-ui, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: glide-dock-installer
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Glide-Dock-v*-Setup.exe
            release-assets/Glide-Dock-v*-Setup.exe.sha256

  publish-cnb:
    needs: [rust-checks, test-ui, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: glide-dock-installer
          path: release-assets
      - name: Publish CNB Release
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_REPOSITORY || 'won114514/Glide-Dock' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-cnb.mjs --tag "$RELEASE_TAG" --assets release-assets --publication release
