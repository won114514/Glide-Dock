[package]
name = "glide-uninstall"
description = "Glide-Dock uninstaller"
build = "../installer/build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "glide-uninstall"
path = "../installer/src/main.rs"

[dependencies]
dock-core.workspace = true
dock-platform-windows.workspace = true
dock-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "=1.0.28"
tracing.workspace = true
tauri = { version = "=2.12.7", default-features = false, features = ["wry", "custom-protocol", "compression", "common-controls-v6"] }
webview2-com = "=0.39.1"
windows.workspace = true
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = "=2.7.6"
